# Pinned to match AGP 8.7.3 in gradle/libs.versions.toml.
#
# Arch's system Gradle is 9.6.1, which AGP 8.7 does not accept. That mismatch
# only bites if you bootstrap the wrapper by hand — if you do, pass the version
# explicitly:
#
#     gradle wrapper --gradle-version 8.11.1
#
# Opening the project in Android Studio avoids the issue entirely: it generates
# a wrapper compatible with whatever AGP the project is on.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
